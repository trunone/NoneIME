name: Build NoneIME

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Debug, Release]
        platform: [x64, Win32]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build NoneIME (${{ matrix.platform }} - ${{ matrix.configuration }})
        shell: powershell
        run: |
          .\build.ps1 -Configuration ${{ matrix.configuration }} -Platform ${{ matrix.platform }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NoneIME-${{ matrix.platform }}-${{ matrix.configuration }}
          path: bin/${{ matrix.platform }}/${{ matrix.configuration }}/
