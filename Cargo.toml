[package]
name = "noneime"
version = "1.0.0"
edition = "2021"
authors = ["None IME Contributors"]
description = "None IME - Traditional Chinese Boshiamy Input Method Editor"
license = "MIT"

[lib]
name = "NoneIME"
crate-type = ["cdylib", "rlib"]

[target.'cfg(windows)'.dependencies]
windows-core = { version = "0.62", default-features = false }
windows = { version = "0.62", default-features = false, features = [
    "Win32_Foundation",
    "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
] }

[dependencies]
imekit = "0.2.3"

[[bin]]
name = "noneime"
path = "src/main.rs"

[build-dependencies]
embed-resource = "3.0"
